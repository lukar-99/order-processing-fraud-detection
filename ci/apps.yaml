apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-consumer-deployment
  namespace: order-processing
spec:
  replicas: 0
  selector:
    matchLabels:
      app: order-consumer
  template:
    metadata:
      labels:
        app: order-consumer
    spec:
      containers:
      - name: consumer
        image: order-consumer:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_SERVER
          value: "kafka.order-processing.svc.cluster.local:9092"