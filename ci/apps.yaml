apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: order-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: apache/kafka:latest
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka:9092"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@localhost:29093"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: order-processing
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: order-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
      - name: api
        image: order-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: KAFKA_SERVER
          value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: order-api-service
  namespace: order-processing
spec:
  type: ClusterIP
  selector:
    app: order-api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-consumer-deployment
  namespace: order-processing
spec:
  replicas: 0
  selector:
    matchLabels:
      app: order-consumer
  template:
    metadata:
      labels:
        app: order-consumer
    spec:
      containers:
      - name: consumer
        image: order-consumer:v1
        imagePullPolicy: Never
        env:
        - name: KAFKA_SERVER
          value: "kafka:9092"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-consumer-scaler
  namespace: order-processing
spec:
  scaleTargetRef:
    name: order-consumer-deployment
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 30
  pollingInterval: 5
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka.order-processing.svc.cluster.local:9092
      consumerGroup: order-processor-group
      topic: order-events
      lagThreshold: "10"