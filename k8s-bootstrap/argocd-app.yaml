apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-processing-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/lukar-99/order-processing-fraud-detection.git'
    targetRevision: HEAD
    path: ci
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: order-processing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true